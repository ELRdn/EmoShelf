name: Feature request
description: Propose a focused improvement to the Personal Emoji Shelf
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is slow, confusing, inaccessible, or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the smallest useful behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Shelf workflow impact
      description: How does this support “Open Shelf → reach item → paste”?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require an account, telemetry, or cloud service for core use.
          required: true
