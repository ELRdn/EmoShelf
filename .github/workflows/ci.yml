name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck / lint / test / build / release audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:audit

  rust:
    name: Rust (fmt / clippy / test / check)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked

  tauri-e2e:
    name: Tauri WebDriverIO (${{ matrix.arch }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked

      - name: Install the EdgeDriver matching WebView2
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool `
            --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 `
            --locked
          & "$env:CARGO_HOME\bin\msedgedriver-tool.exe"
          & "$PWD\msedgedriver.exe" --version
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build isolated E2E app
        run: pnpm tauri build --debug --no-bundle --ci --config src-tauri/tauri.e2e.conf.json

      - name: Exercise the real Tauri window
        run: pnpm test:e2e
        env:
          EMOSHELF_E2E_SKIP_BUILD: "1"

  package-windows:
    name: Windows packaging (${{ matrix.arch }} / ${{ matrix.bundle }})
    needs: [frontend, rust, tauri-e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            bundle: nsis
          - arch: aarch64
            runner: windows-11-arm
            bundle: nsis
          - arch: x86_64
            runner: windows-latest
            bundle: msi
          - arch: aarch64
            runner: windows-11-arm
            bundle: msi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundle }} --ci

      - uses: actions/upload-artifact@v7
        with:
          name: emoshelf-windows-${{ matrix.arch }}-${{ matrix.bundle }}
          if-no-files-found: error
          path: app/src-tauri/target/release/bundle/${{ matrix.bundle }}/*
