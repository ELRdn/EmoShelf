[package]
name = "emoshelf"
version = "0.4.0"
description = "Your personal emoji shelf."
authors = ["EmoShelf Contributors"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emoshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# グローバルショートカット（Alt+E 等）・表示切替
tauri-plugin-global-shortcut = "2"
# クリップボード書き込み（ペースト・コピーの基盤）
tauri-plugin-clipboard-manager = "2"
# 二重起動を抑止して既存ウィンドウへフォーカス
tauri-plugin-single-instance = "2"
# ウィンドウサイズ・位置の自動復元
tauri-plugin-window-state = "2"
# Ctrl+V シミュレーション（フォアグラウンドへのペースト用）
enigo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# カスタム画像アセット（PNG/WebP/SVG → PNG 正規化）
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
resvg = { version = "0.48.1", default-features = false }
ed25519-dalek = "2.2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
